name: Daily Auto-Improvement

on:
  schedule:
    # 毎日 AM 6:00 JST (前日 21:00 UTC) — パイプライン完了後に実行
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: giin
          POSTGRES_PASSWORD: giin
          POSTGRES_DB: giin_score
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: pip install ".[dev]"
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Claude Code auto-improvement
        id: improve
        run: |
          PROMPT=$(cat scripts/daily-improve-prompt.md)
          npx -y @anthropic-ai/claude-code \
            -p "$PROMPT" \
            --allowedTools "Edit,Write,Bash,Read,Glob,Grep" \
            --max-turns 40 \
            --model claude-sonnet-4-6 \
            > /tmp/claude-output.txt 2>&1 || true
          cat /tmp/claude-output.txt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: postgresql://giin:giin@localhost:5432/giin_score

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests (verify)
        if: steps.changes.outputs.has_changes == 'true'
        id: tests
        run: |
          cd frontend && npx tsc --noEmit && npx next build && cd ..
          cd backend && ruff check app/ && python -m pytest app/tests/ -q && cd ..
        env:
          DATABASE_URL: sqlite:///test.db
        continue-on-error: true

      - name: Create PR
        if: steps.changes.outputs.has_changes == 'true' && steps.tests.outcome == 'success'
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="auto-improve/${DATE}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "feat: Daily auto-improvement ${DATE}

          Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"

          git push origin "$BRANCH"

          # サマリーファイルがあれば使う
          if [ -f /tmp/improve-summary.md ]; then
            BODY=$(cat /tmp/improve-summary.md)
          else
            BODY="Claude Code による日次自動改善です。変更内容は差分を確認してください。"
          fi

          gh pr create \
            --title "feat: Daily auto-improvement ${DATE}" \
            --body "$(cat <<EOF
          ## Daily Auto-Improvement

          ${BODY}

          ---
          🤖 Generated by [Claude Code](https://claude.com/claude-code) daily improvement pipeline
          EOF
          )" \
            --base master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord (success)
        if: steps.changes.outputs.has_changes == 'true' && steps.tests.outcome == 'success'
        run: |
          DATE=$(date +%Y-%m-%d)
          SUMMARY=""
          if [ -f /tmp/improve-summary.md ]; then
            SUMMARY=$(head -c 1500 /tmp/improve-summary.md)
          fi
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"🔧 デイリー自動改善 PR作成 (${DATE})\",\"description\":\"${SUMMARY}\",\"color\":3066993}]}" || true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify Discord (no changes)
        if: steps.changes.outputs.has_changes == 'false'
        run: |
          DATE=$(date +%Y-%m-%d)
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"📝 デイリー自動改善 (${DATE})\",\"description\":\"本日は改善点が見つかりませんでした。\",\"color\":9807270}]}" || true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify Discord (test failure)
        if: steps.changes.outputs.has_changes == 'true' && steps.tests.outcome == 'failure'
        run: |
          DATE=$(date +%Y-%m-%d)
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ デイリー自動改善 テスト失敗 (${DATE})\",\"description\":\"改善を実装しましたがテストが失敗したため、PRは作成されませんでした。\",\"color\":15158332}]}" || true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
